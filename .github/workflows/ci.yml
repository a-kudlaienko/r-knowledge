name: CI

# Two jobs:
#  * build — every push/PR: builds the sdist + wheel, validates the
#    distribution metadata (catches the MIT license fields, missing
#    package-data, bad long-description), installs the wheel into a clean
#    env, and confirms the `knowledge` entry point imports and runs.
#  * test — every push (main/devel) and every PR: runs the pytest suite,
#    then the deterministic golden-query eval suite (`-m eval`, tests/eval/;
#    measured ~0.3-0.5s — negligible, so it runs unconditionally rather than
#    being confined to a main-only or opt-in job). The Docker-backed
#    shared-PG harness (`-m integration`) is deselected — CI runners have
#    Docker, so without the filter a plain pytest run would launch the full
#    15-minute end-to-end scenario; it stays a local/manual tool
#    (`pytest -m integration`).

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-install the wheel
        run: pip install dist/*.whl

      - name: Verify CLI entry point
        run: knowledge --help

      - name: Upload distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/*

  test:
    # Runs on every PR and every push to main/devel (see the `on:` trigger
    # above) — previously gated to push-to-main only, so pytest never ran on
    # PRs or on devel pushes; only `build` (which executes no tests) did.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with test + postgres extras
        # postgres extra: several unit tests exercise the psycopg/pgvector
        # code paths with mocks but import the real modules.
        run: pip install -e '.[dev,postgres]'

      - name: Run test suite
        run: python -m pytest tests/ -m "not integration" -q

      - name: Run golden-query eval suite
        # Deterministic, zero-network retrieval regression sensor (tests/eval/):
        # recall@k/MRR floors plus the two historical silent-regression guards
        # (project-scope starvation, supersede/authority ranking). Excluded
        # from the run above (`-m "not integration"` does not select `eval`);
        # measured at ~0.3-0.5s locally, so it runs as its own step on every
        # PR/push rather than being confined to a main-only or opt-in job.
        run: python -m pytest tests/eval -m eval -q
